name: Synon Biomed Main Integration Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-quality-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  main-quality:
    name: Main integration policy and static analysis
    outputs:
      go-matrix: ${{ steps.go-scope.outputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable GitHub Actions policy
        run: |
          go test -buildvcs=false ./scripts/quality/github-actions-gate
          go run -buildvcs=false ./scripts/quality/github-actions-gate --repo . --policy docs/governance/github-actions-pins.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify integrated source policy
        run: |
          go mod verify
          go mod tidy -diff
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.quality.test_portable_paths scripts.quality.test_module_topology_gate scripts.quality.test_product_identity_gate scripts.quality.test_release_candidate_manifest scripts.quality.test_release_receipt_gate scripts.quality.test_pr_fast_scope scripts.quality.test_pr_dependency_scope scripts.quality.test_pr_test_partition scripts.quality.test_verification_scope
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/quality/portable_paths.py --repo .
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/quality/module_topology_gate.py --repo .
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/quality/product_identity_gate.py --repo . --mode candidate
          bash scripts/audit/audit-source-clean.sh

      - name: Verify formatting and affected static analysis
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/quality/pr_fast_scope.py --vet \
            --base '${{ github.event.before }}' --head '${{ github.sha }}'

      - name: Plan affected Go partitions
        id: go-scope
        run: |
          matrix=$(PYTHONDONTWRITEBYTECODE=1 python3 scripts/quality/pr_fast_scope.py --matrix \
            --base '${{ github.event.before }}' --head '${{ github.sha }}')
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  main-go-shards:
    name: Main affected Go partition (${{ matrix.index }})
    needs: main-quality
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.main-quality.outputs.go-matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --disable-userns --unshare-ipc --unshare-uts \
            --new-session --die-with-parent --unshare-net --unshare-pid \
            --ro-bind / / --proc /proc --dev /dev /bin/true
          runtime_python="$(command -v python3)"
          sudo "$runtime_python" -m pip install --break-system-packages --ignore-installed \
            --requirement assets/optional/mcp-servers/bio-tools/requirements-test.txt
          "$runtime_python" -c 'import anyio, httpx, jsonschema, lxml, mcp, pandas, requests, urllib3; from PIL import Image'

      - name: Test integrated Go dependency closure
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/quality/pr_fast_scope.py \
            --base '${{ github.event.before }}' --head '${{ github.sha }}' \
            --shard-index '${{ matrix.index }}' --shard-count '${{ matrix.count }}' \
            --log-dir "$RUNNER_TEMP/runtime-test-evidence"

      - name: Audit main test source residue
        if: always()
        run: bash scripts/audit/audit-source-clean.sh

      - name: Upload main test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-runtime-evidence-${{ github.sha }}-${{ matrix.index }}
          path: ${{ runner.temp }}/runtime-test-evidence/
          if-no-files-found: warn
          retention-days: 7

  main-go-tests:
    name: Main changed Go packages
    needs: [main-quality, main-go-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every affected Go partition
        run: |
          test '${{ needs.main-quality.result }}' = 'success'
          test '${{ needs.main-go-shards.result }}' = 'success'

  main-frontend-tests:
    name: Main frontend scope
    needs: main-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up frontend build runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test integrated frontend scope
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/quality/pr_fast_scope.py --frontend --base '${{ github.event.before }}' --head '${{ github.sha }}'

  main-integration-gate:
    name: Main Integration / required
    needs: [main-frontend-tests, main-go-tests, main-quality]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required job results
        run: |
          test '${{ needs.main-frontend-tests.result }}' = 'success'
          test '${{ needs.main-go-tests.result }}' = 'success'
          test '${{ needs.main-quality.result }}' = 'success'
