name: Synon Biomed Release Container

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-container-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable GitHub Actions policy
        run: |
          go test -buildvcs=false ./scripts/quality/github-actions-gate
          go run -buildvcs=false ./scripts/quality/github-actions-gate --repo . --policy docs/governance/github-actions-pins.json
      - name: Verify release input contracts
        run: python3 -B -m unittest scripts.packaging.test_release_container

  publish-container:
    needs: package-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify release archives and publish container
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/packaging/release_container.py
