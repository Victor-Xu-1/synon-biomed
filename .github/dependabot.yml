version: 2
updates:
  - package-ecosystem: docker
    directory: /scripts/packaging
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
